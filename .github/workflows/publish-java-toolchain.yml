name: Publish Java toolchain

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-java-toolchain
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: toolchains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TOOLCHAIN_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TOOLCHAIN_AWS_REGION }}
      - name: Download, verify and publish immutable artifacts
        run: node scripts/publish-java-toolchain.mjs
        env:
          TOOLCHAIN_BUCKET: ${{ vars.TOOLCHAIN_BUCKET }}
          TOOLCHAIN_PREFIX: toolchains
